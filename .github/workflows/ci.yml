name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: |
          # Only lint .ts files for now — .gs files will be migrated to .ts incrementally
          if find src -name "*.ts" | grep -q .; then
            npx eslint "src/**/*.ts"
          else
            echo "No .ts files found yet — skipping lint (migrate .gs to .ts to enable)"
          fi

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript type check
        run: |
          # Only typecheck when .ts files exist
          if find src -name "*.ts" | grep -q .; then
            npx tsc --noEmit
          else
            echo "No .ts files found yet — skipping typecheck (migrate .gs to .ts to enable)"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          if find src -name "*.ts" | grep -q .; then
            npx tsc
          else
            echo "No .ts files found yet — skipping build (migrate .gs to .ts to enable)"
          fi
